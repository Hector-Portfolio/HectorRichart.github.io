<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hector Richart — A Room of My Own</title>
<meta name="description" content="An explorable 3D room. Hector Richart, Full-Stack Developer & Data Engineer based in Ciudad Juarez. Click around — every object opens something.">
<meta property="og:title" content="Hector Richart — A Room of My Own">
<meta property="og:description" content="An explorable 3D portfolio. Click the monitor for projects, the bookshelf for skills, the frames for travel.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
:root{
  --ink:#1a1410;--paper:#f5e9d3;--paper-2:#ebdcbe;--paper-3:#d9c79e;
  --wood:#7a4a26;--wood-d:#4a2a14;
  --amber:#f4a460;--amber-2:#e08a3a;--teal:#4ec9b0;--teal-d:#2a8576;--rose:#d96874;
  --shadow:rgba(26,20,16,.4);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r-sm:6px;--r-md:12px;--r-lg:20px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{
  background:#0a0e1a;color:var(--paper);
  font-family:var(--sans);line-height:1.6;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
input,textarea{font-family:inherit;user-select:auto}
canvas{display:block;outline:none}

/* ── Loader ───────────────────────────────── */
#loader{
  position:fixed;inset:0;z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;background:#0a0e1a;
  transition:opacity .8s var(--ease);
}
#loader.gone{opacity:0;pointer-events:none}
.loader-glyph{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(2.4rem,6vw,3.6rem);color:var(--paper);
  letter-spacing:-.01em;
  animation:flicker 3s var(--ease) infinite;
}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.6}}
.loader-bar{
  width:240px;height:2px;background:rgba(245,233,211,.12);
  border-radius:2px;overflow:hidden;
}
.loader-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--amber),var(--teal));
  transition:width .4s var(--ease);
}
.loader-text{
  font-family:var(--mono);font-size:.7rem;
  color:rgba(245,233,211,.5);letter-spacing:.15em;
  text-transform:uppercase;
}

/* ── Canvas + 3D scene ────────────────────── */
#canvas{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
#canvas.grabbing{cursor:grabbing}
#canvas.hovering{cursor:pointer}

/* ── HUD ──────────────────────────────────── */
#hud{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  opacity:0;transition:opacity .8s var(--ease);
}
#hud.on{opacity:1}
.hud-top{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 28px;pointer-events:auto;
}
.brand{
  display:flex;align-items:center;gap:12px;
  text-decoration:none;color:var(--paper);
}
.brand-mark{
  width:38px;height:38px;display:grid;place-items:center;
  background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-style:italic;font-size:1.15rem;
  border-radius:var(--r-sm);
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.brand-name{
  font-family:var(--serif);font-style:italic;font-size:1.25rem;
  letter-spacing:-.01em;
}
.brand-name b{font-style:normal;font-family:var(--mono);font-size:.7rem;display:block;letter-spacing:.1em;color:rgba(245,233,211,.5);text-transform:uppercase}
.hud-actions{display:flex;gap:8px}
.hud-btn{
  width:38px;height:38px;display:grid;place-items:center;
  border:1px solid rgba(245,233,211,.18);border-radius:var(--r-sm);
  background:rgba(10,14,26,.5);backdrop-filter:blur(12px);
  color:var(--paper);font-size:1rem;
  transition:all .25s var(--ease);
}
.hud-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(244,164,96,.1)}

.hud-bottom{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;
  padding:10px 22px;
  background:rgba(10,14,26,.55);backdrop-filter:blur(14px);
  border:1px solid rgba(245,233,211,.1);
  border-radius:50px;
  font-family:var(--mono);font-size:.7rem;
  color:rgba(245,233,211,.7);letter-spacing:.05em;
  pointer-events:auto;
}
.hud-bottom kbd{
  background:rgba(245,233,211,.12);
  padding:2px 8px;border-radius:4px;
  font-family:var(--mono);font-size:.65rem;
  color:var(--amber);
  margin-right:5px;
}
.hud-bottom .sep{opacity:.3}

#hoverLabel{
  position:absolute;
  padding:8px 14px;
  background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:.7rem;
  letter-spacing:.05em;text-transform:uppercase;
  border-radius:var(--r-sm);
  transform:translate(-50%,-150%);
  white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .15s var(--ease);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#hoverLabel.on{opacity:1}
#hoverLabel::after{
  content:'';position:absolute;
  bottom:-6px;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--paper);border-bottom:0;
}

.intro-card{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
  animation:introFade 4.5s var(--ease) forwards;
  animation-delay:.4s;opacity:0;
}
@keyframes introFade{
  0%{opacity:0;transform:translate(-50%,-40%)}
  20%,75%{opacity:1;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(-50%,-60%)}
}
.intro-eyebrow{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--amber);margin-bottom:14px;
}
.intro-title{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(2.4rem,6vw,4.4rem);
  color:var(--paper);line-height:1;letter-spacing:-.02em;
  text-shadow:0 4px 30px rgba(0,0,0,.6);
}
.intro-sub{
  font-family:var(--mono);font-size:.75rem;
  color:rgba(245,233,211,.7);margin-top:14px;letter-spacing:.1em;
}

/* ── Side Panel ───────────────────────────── */
#panelBackdrop{
  position:fixed;inset:0;z-index:50;
  background:rgba(10,14,26,.55);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease);
}
#panelBackdrop.on{opacity:1;pointer-events:auto}
#panel{
  position:fixed;top:0;right:0;bottom:0;z-index:60;
  width:min(560px,92vw);
  background:var(--paper);color:var(--ink);
  transform:translateX(100%);
  transition:transform .55s var(--ease);
  overflow-y:auto;overflow-x:hidden;
  box-shadow:-30px 0 80px rgba(0,0,0,.5);
}
#panel.on{transform:translateX(0)}
#panel::-webkit-scrollbar{width:6px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:rgba(26,20,16,.2);border-radius:3px}
.panel-close{
  position:absolute;top:18px;right:18px;z-index:2;
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:var(--r-sm);
  background:rgba(26,20,16,.06);
  color:var(--ink);font-size:1.1rem;
  transition:all .25s var(--ease);
}
.panel-close:hover{background:var(--ink);color:var(--paper);transform:rotate(90deg)}
.panel-body{padding:64px 48px 64px}
.panel-eyebrow{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--amber-2);margin-bottom:8px;
}
.panel-title{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(2.2rem,5vw,3.2rem);
  line-height:1;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em;
}
.panel-title em{font-style:normal;font-family:var(--sans);font-weight:600;font-size:.45em;display:block;color:var(--wood);letter-spacing:0;margin-top:8px}
.panel-divider{
  width:60px;height:1px;background:var(--wood);margin:24px 0 28px;
}

/* About panel */
.about-text{font-size:1.02rem;color:var(--ink);line-height:1.75;margin-bottom:16px}
.about-text:last-of-type{margin-bottom:24px}
.about-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px;
}
.about-stat{
  background:var(--paper-2);border:1px solid var(--paper-3);
  border-radius:var(--r-md);padding:18px 20px;
}
.about-stat-num{
  font-family:var(--serif);font-style:italic;
  font-size:2rem;color:var(--ink);line-height:1;
}
.about-stat-lbl{font-size:.78rem;color:var(--wood);margin-top:4px}

/* Experience panel */
.exp-item{
  position:relative;padding:0 0 28px 28px;
  border-left:1px solid var(--paper-3);
}
.exp-item::before{
  content:'';position:absolute;left:-5px;top:6px;
  width:9px;height:9px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 0 3px var(--paper);
}
.exp-item:last-child{border-left-color:transparent;padding-bottom:0}
.exp-date{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;
  color:var(--wood);text-transform:uppercase;
}
.exp-role{font-weight:600;font-size:1.05rem;margin:4px 0 2px}
.exp-co{font-family:var(--mono);font-size:.82rem;color:var(--teal-d);margin-bottom:8px}
.exp-desc{font-size:.92rem;color:var(--ink);line-height:1.65;margin-bottom:10px}
.exp-tags{display:flex;flex-wrap:wrap;gap:6px}
.exp-tag{
  font-family:var(--mono);font-size:.65rem;
  background:var(--paper-2);color:var(--wood-d);
  padding:3px 10px;border-radius:50px;border:1px solid var(--paper-3);
}

/* Skills panel */
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.skill-cell{
  background:var(--paper-2);border:1px solid var(--paper-3);
  border-radius:var(--r-md);padding:18px;
  transition:all .25s var(--ease);
}
.skill-cell:hover{border-color:var(--amber);transform:translateY(-3px)}
.skill-icon{
  width:36px;height:36px;display:grid;place-items:center;
  background:var(--paper);border-radius:var(--r-sm);
  color:var(--amber-2);font-size:1.1rem;margin-bottom:10px;
}
.skill-name{font-weight:600;font-size:.95rem;margin-bottom:4px}
.skill-desc{font-size:.8rem;color:var(--wood);line-height:1.5;margin-bottom:8px}
.skill-tags{display:flex;flex-wrap:wrap;gap:4px}
.skill-tag{
  font-family:var(--mono);font-size:.6rem;
  color:var(--wood-d);background:var(--paper);
  padding:2px 7px;border-radius:50px;
}

/* Projects panel */
.proj{margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--paper-3)}
.proj:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.proj-num{
  font-family:var(--serif);font-style:italic;
  font-size:1rem;color:var(--amber-2);
}
.proj-name{font-family:var(--serif);font-size:1.6rem;line-height:1.1;margin:2px 0 10px;color:var(--ink)}
.proj-meta{
  display:flex;gap:14px;font-family:var(--mono);font-size:.7rem;
  color:var(--wood);margin-bottom:14px;
}
.proj-img{
  width:100%;aspect-ratio:16/9;background:var(--paper-3);
  border-radius:var(--r-md);overflow:hidden;margin-bottom:14px;
  position:relative;
}
.proj-img img{width:100%;height:100%;object-fit:cover}
.proj-slides-wrap{position:relative}
.proj-dots-row{
  display:flex;gap:6px;justify-content:center;margin-top:10px;
}
.proj-dot-btn{
  width:24px;height:3px;background:var(--paper-3);border-radius:2px;
  transition:background .25s var(--ease);
}
.proj-dot-btn.on{background:var(--ink)}
.proj-desc{font-size:.92rem;color:var(--ink);line-height:1.65;margin-bottom:14px}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.proj-tag{
  font-family:var(--mono);font-size:.65rem;
  background:var(--paper-2);color:var(--wood-d);
  padding:3px 10px;border-radius:50px;border:1px solid var(--paper-3);
}
.proj-link{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:.75rem;
  color:var(--ink);text-decoration:none;
  padding:8px 16px;border:1px solid var(--ink);border-radius:var(--r-sm);
  transition:all .25s var(--ease);
}
.proj-link:hover{background:var(--ink);color:var(--paper)}

/* Gallery panel */
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal-cell{
  aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;
  cursor:pointer;position:relative;background:var(--paper-3);
}
.gal-cell img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.gal-cell:hover img{transform:scale(1.08)}
.gal-cell.tall{grid-row:span 2;aspect-ratio:1/2}
.gal-cell.wide{grid-column:span 2;aspect-ratio:2/1}
.gal-ov{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(26,20,16,.7) 0%,rgba(26,20,16,0) 50%);
  opacity:0;transition:opacity .25s var(--ease);
  display:flex;align-items:flex-end;padding:14px;
}
.gal-cell:hover .gal-ov{opacity:1}
.gal-ov-t{font-weight:600;font-size:.85rem;color:var(--paper)}
.gal-ov-l{font-family:var(--mono);font-size:.7rem;color:rgba(245,233,211,.7)}

/* Contact panel */
.c-links{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.c-link{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:var(--paper-2);border:1px solid var(--paper-3);
  border-radius:var(--r-md);
  text-decoration:none;color:var(--ink);
  transition:all .25s var(--ease);font-size:.9rem;
}
.c-link:hover{border-color:var(--amber);transform:translateX(4px)}
.c-link i{font-size:1.2rem;color:var(--amber-2);width:24px}
.c-form{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.f-group label{
  display:block;font-family:var(--mono);font-size:.7rem;
  letter-spacing:.05em;color:var(--wood);margin-bottom:6px;
  text-transform:uppercase;
}
.f-group input,.f-group textarea{
  width:100%;padding:12px 14px;
  background:var(--paper-2);border:1px solid var(--paper-3);
  border-radius:var(--r-sm);color:var(--ink);
  font-family:var(--sans);font-size:.92rem;
  transition:border-color .25s var(--ease);
}
.f-group input:focus,.f-group textarea:focus{
  outline:none;border-color:var(--amber);background:var(--paper);
}
.f-group textarea{resize:vertical;min-height:110px}
.f-btn{
  padding:14px 24px;background:var(--ink);color:var(--paper);
  border-radius:var(--r-sm);
  font-family:var(--mono);font-size:.78rem;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;
  transition:all .25s var(--ease);
}
.f-btn:hover{background:var(--wood);transform:translateY(-2px)}
.f-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* Resume button (about panel) */
.cv-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 22px;background:var(--ink);color:var(--paper);
  border-radius:var(--r-sm);text-decoration:none;
  font-family:var(--mono);font-size:.78rem;letter-spacing:.05em;
  text-transform:uppercase;margin-top:8px;
  transition:all .25s var(--ease);
}
.cv-btn:hover{background:var(--wood);transform:translateY(-2px)}

/* ── Lightbox ─────────────────────────────── */
#lightbox{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,14,26,.95);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
}
#lightbox.on{display:flex}
.lb-img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:var(--r-md)}
.lb-close,.lb-prev,.lb-next{
  position:absolute;
  width:46px;height:46px;display:grid;place-items:center;
  background:rgba(245,233,211,.1);color:var(--paper);
  border-radius:50%;font-size:1.2rem;
  transition:background .25s var(--ease);
}
.lb-close:hover,.lb-prev:hover,.lb-next:hover{background:rgba(245,233,211,.2)}
.lb-close{top:24px;right:24px}
.lb-prev{left:24px;top:50%;transform:translateY(-50%)}
.lb-next{right:24px;top:50%;transform:translateY(-50%)}
.lb-cap{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  text-align:center;color:var(--paper);
}
.lb-cap h3{font-family:var(--serif);font-style:italic;font-size:1.4rem}
.lb-cap p{font-family:var(--mono);font-size:.75rem;color:rgba(245,233,211,.6);margin-top:4px}

/* ── Toast ────────────────────────────────── */
#toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120%);
  z-index:300;
  padding:14px 22px;background:var(--ink);color:var(--paper);
  border-radius:var(--r-md);
  display:flex;align-items:center;gap:10px;
  font-size:.9rem;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  transition:transform .4s var(--ease);
}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast i{color:var(--teal)}

/* ── Mobile ───────────────────────────────── */
@media (max-width:768px){
  .panel-body{padding:56px 28px 56px}
  .skill-grid,.about-stats{grid-template-columns:1fr}
  .hud-top{padding:14px 16px}
  .brand-name{font-size:1.05rem}
  .hud-bottom{font-size:.6rem;padding:8px 14px;gap:10px;bottom:18px}
}

/* ── Reduced motion ───────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.1s!important}
}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loader">
  <div class="loader-glyph">A Room of My Own</div>
  <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
  <div class="loader-text" id="loaderText">Tuning into the room…</div>
</div>

<!-- 3D canvas -->
<canvas id="canvas"></canvas>

<!-- HUD overlay -->
<div id="hud">
  <div class="hud-top">
    <a href="#" class="brand" onclick="event.preventDefault()">
      <span class="brand-mark">H</span>
      <span class="brand-name">Hector Richart<b>A Room of My Own</b></span>
    </a>
    <div class="hud-actions">
      <button class="hud-btn" id="resetBtn" title="Reset view"><i class="bi bi-arrow-counterclockwise"></i></button>
      <button class="hud-btn" id="muteBtn" title="Toggle ambient sound"><i class="bi bi-volume-mute"></i></button>
    </div>
  </div>

  <div class="intro-card">
    <div class="intro-eyebrow">A space for software & memory</div>
    <div class="intro-title">Step inside</div>
    <div class="intro-sub">click any object · drag to look around</div>
  </div>

  <div class="hud-bottom">
    <span><kbd>drag</kbd>orbit</span>
    <span class="sep">·</span>
    <span><kbd>scroll</kbd>zoom</span>
    <span class="sep">·</span>
    <span><kbd>click</kbd>objects</span>
  </div>

  <div id="hoverLabel"></div>
</div>

<!-- Side panel -->
<div id="panelBackdrop"></div>
<aside id="panel" aria-hidden="true">
  <button class="panel-close" onclick="window.closePanel()"><i class="bi bi-x-lg"></i></button>
  <div class="panel-body" id="panelBody"></div>
</aside>

<!-- Lightbox -->
<div id="lightbox">
  <button class="lb-close" onclick="window.closeLB()"><i class="bi bi-x-lg"></i></button>
  <button class="lb-prev" onclick="window.navLB(-1)"><i class="bi bi-chevron-left"></i></button>
  <button class="lb-next" onclick="window.navLB(1)"><i class="bi bi-chevron-right"></i></button>
  <img class="lb-img" id="lbImg" src="" alt="">
  <div class="lb-cap"><h3 id="lbT"></h3><p id="lbL"></p></div>
</div>

<!-- Toast -->
<div id="toast"><i class="bi bi-check-circle-fill"></i><span>Message sent</span></div>

<!-- EmailJS (preserved from original) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>emailjs.init("hzW9G7iKUaLNrL7-e");</script>

<!-- Three.js via importmap -->

/* ═══════════════════════════════════════════════════════════
   RAYCASTING + HOVER + CLICK
   ═══════════════════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-2, -2);
let pointerMoved = false;
let dragDist = 0;
let downPos = { x:0, y:0 };
let hovered = null;
const hoverLabel = document.getElementById('hoverLabel');

function setPointer(e) {
  const t = e.touches ? e.touches[0] : e;
  pointer.x = (t.clientX / innerWidth) * 2 - 1;
  pointer.y = -(t.clientY / innerHeight) * 2 + 1;
  pointerMoved = true;
}

canvas.addEventListener('pointerdown', e => {
  downPos = { x:e.clientX, y:e.clientY };
  dragDist = 0;
  canvas.classList.add('grabbing');
});
canvas.addEventListener('pointermove', e => {
  setPointer(e);
  if (e.buttons) {
    dragDist += Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > dragDist
      ? Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) : 0;
  }
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('grabbing');
  if (dragDist < 6) handleClick(e);
});
canvas.addEventListener('pointerleave', () => { canvas.classList.remove('grabbing'); });

function checkHover() {
  if (!pointerMoved) return;
  raycaster.setFromCamera(pointer, camera);
  const meshes = INTERACTIVES.map(i => i.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  const hit = hits.length ? INTERACTIVES.find(i => i.mesh === hits[0].object) : null;

  if (hit !== hovered) {
    if (hovered) restoreHover(hovered);
    hovered = hit;
    if (hit) {
      applyHover(hit);
      canvas.classList.add('hovering');
      hoverLabel.textContent = hit.label;
      hoverLabel.classList.add('on');
    } else {
      canvas.classList.remove('hovering');
      hoverLabel.classList.remove('on');
    }
  }
  if (hovered) {
    const v = new THREE.Vector3();
    hovered.mesh.getWorldPosition(v);
    v.project(camera);
    const x = (v.x * 0.5 + 0.5) * innerWidth;
    const y = (-v.y * 0.5 + 0.5) * innerHeight;
    hoverLabel.style.left = x + 'px';
    hoverLabel.style.top = y + 'px';
  }
}

function applyHover(it) {
  const g = it.hoverGroup || it.mesh;
  if (!g.userData.origScale) g.userData.origScale = g.scale.clone();
  g.userData.targetScale = g.userData.origScale.clone().multiplyScalar(1.04);
}
function restoreHover(it) {
  const g = it.hoverGroup || it.mesh;
  if (g.userData.origScale) g.userData.targetScale = g.userData.origScale.clone();
}

function handleClick(e) {
  if (!hovered) return;
  openHotspot(hovered);
}

/* ═══════════════════════════════════════════════════════════
   CAMERA TWEEN
   ═══════════════════════════════════════════════════════════ */
const tween = { active:false, t:0, dur:1.2, fromPos:new THREE.Vector3(), toPos:new THREE.Vector3(), fromTgt:new THREE.Vector3(), toTgt:new THREE.Vector3() };
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function tweenCamera(toPos, toTgt, dur=1.2) {
  tween.fromPos.copy(camera.position);
  tween.fromTgt.copy(controls.target);
  tween.toPos.copy(toPos);
  tween.toTgt.copy(toTgt);
  tween.t = 0;
  tween.dur = dur;
  tween.active = true;
  controls.autoRotate = false;
  controls.enabled = false;
}

function updateTween(dt) {
  if (!tween.active) return;
  tween.t += dt / tween.dur;
  if (tween.t >= 1) {
    tween.t = 1;
    tween.active = false;
    controls.enabled = true;
  }
  const k = easeInOut(tween.t);
  camera.position.lerpVectors(tween.fromPos, tween.toPos, k);
  controls.target.lerpVectors(tween.fromTgt, tween.toTgt, k);
}

/* ═══════════════════════════════════════════════════════════
   PANEL SYSTEM
   ═══════════════════════════════════════════════════════════ */
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const panelBackdrop = document.getElementById('panelBackdrop');
let activeHotspot = null;

function openHotspot(it) {
  activeHotspot = it;
  panelBody.innerHTML = PANELS[it.id]();
  panel.classList.add('on');
  panelBackdrop.classList.add('on');
  panel.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  tweenCamera(it.focus, it.target, 1.1);
  attachPanelHandlers(it.id);
}

window.closePanel = function() {
  panel.classList.remove('on');
  panelBackdrop.classList.remove('on');
  panel.setAttribute('aria-hidden','true');
  activeHotspot = null;
  document.body.style.overflow = '';
  tweenCamera(HOME_POS, HOME_LOOK, 1.0);
  setTimeout(() => { if (!activeHotspot) controls.autoRotate = true; }, 1100);
};

panelBackdrop.addEventListener('click', window.closePanel);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('on')) window.closeLB();
    else if (panel.classList.contains('on')) window.closePanel();
  }
});

/* ═══════════════════════════════════════════════════════════
   PER-PANEL EXTRA HANDLERS (project carousels, gallery, form)
   ═══════════════════════════════════════════════════════════ */
function attachPanelHandlers(id) {
  if (id === 'projects') {
    panelBody.querySelectorAll('.proj-dot-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pi = +btn.dataset.pi, si = +btn.dataset.si;
        const wrap = panelBody.querySelector(`.proj-slides-wrap[data-pi="${pi}"]`);
        wrap.querySelector('img').src = DATA.projects[pi].slides[si];
        wrap.querySelectorAll('.proj-dot-btn').forEach((d,i) => d.classList.toggle('on', i === si));
      });
    });
  }
  if (id === 'gallery') {
    panelBody.querySelectorAll('.gal-cell').forEach(c => {
      c.addEventListener('click', () => openLB(+c.dataset.gi));
    });
  }
  if (id === 'contact') {
    const form = document.getElementById('contactForm');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Sending…';
      emailjs.sendForm(DATA.contact.service, DATA.contact.template, form).then(() => {
        const t = document.getElementById('toast');
        t.classList.add('on');
        setTimeout(() => t.classList.remove('on'), 3500);
        form.reset();
        btn.textContent = 'Send message';
        btn.disabled = false;
      }).catch(() => {
        btn.textContent = 'Error · try again';
        btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Send message'; }, 2500);
      });
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let lastFrame = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  updateTween(dt);
  if (!tween.active) controls.update();

  // Hover-target scale lerp
  scene.traverse(o => {
    if (o.userData && o.userData.targetScale) {
      o.scale.lerp(o.userData.targetScale, 0.18);
    }
  });

  // Lamp gentle flicker
  lampLight.intensity = 1.6 + Math.sin(t * 7) * 0.04 + Math.sin(t * 13) * 0.02;

  // Monitor breathing
  monitorGlow.intensity = 0.7 + Math.sin(t * 1.4) * 0.08;
  M.screen.emissiveIntensity = 0.85 + Math.sin(t * 1.4) * 0.07;

  // Dust drift
  const positions = dust.geometry.attributes.position.array;
  for (let i = 0; i < positions.length; i += 3) {
    positions[i+1] += Math.sin(t * 0.4 + i) * 0.0008;
    positions[i]   += Math.cos(t * 0.3 + i) * 0.0004;
    if (positions[i+1] > 5.5) positions[i+1] = 0.5;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  checkHover();
  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
const loader = document.getElementById('loader');
const loaderFill = document.getElementById('loaderFill');
const loaderText = document.getElementById('loaderText');
const phases = [
  ['Tuning into the room…', 30],
  ['Pouring the coffee…', 60],
  ['Lighting the lamp…', 85],
  ['Welcome.', 100]
];
let phaseI = 0;
function nextPhase() {
  if (phaseI >= phases.length) {
    setTimeout(() => {
      loader.classList.add('gone');
      document.getElementById('hud').classList.add('on');
      controls.autoRotate = true;
    }, 280);
    return;
  }
  const [text, pct] = phases[phaseI];
  loaderText.textContent = text;
  loaderFill.style.width = pct + '%';
  phaseI++;
  setTimeout(nextPhase, 400 + Math.random() * 250);
}

// Kick everything off
animate();
onResize();
setTimeout(nextPhase, 200);

}
